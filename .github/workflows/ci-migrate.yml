name: CI Build & Migrate

on:
  push:
    branches: [ main, deployment ]
  pull_request:
    # run workflow for PRs targeting main only
    branches: [ main ]

jobs:
  build-and-migrate:
    name: Build + Migrate (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Prisma migrations
        # Only run migrations on an actual push to the main branch (not on PR checks)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
